[project]
name = "lerobot-mcp"
version = "0.0.1"
description = "MCP application for discovering, controlling and teaching an SO-101 arm (sim and real) via LeRobot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[feetech,dataset]==0.6.1",
    "mujoco==3.3.7",
    "gymnasium>=1.0",
    "huggingface_hub",
    "numpy",
    "pillow",
    "mcp-use>=1.7.1",
    "cv2-enumerate-cameras>=1.4.0",
]

[project.scripts]
so101-mcp = "so101_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live wrist camera</title><style>
body{font:14px/1.5 system-ui,sans-serif;margin:0;padding:16px;background:#f6f4ef;color:#263b31}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h2{font-size:18px;margin:0}#status{font-size:12px;color:#53685b}img{display:block;width:100%;max-height:480px;object-fit:contain;background:#202722;border-radius:8px;margin:12px 0}button,a{font:inherit;color:inherit}button{border:1px solid #bbc9ba;border-radius:6px;padding:6px 12px;background:#fff;cursor:pointer}p{font-size:12px;color:#5e6e63}[hidden]{display:none!important}
</style></head><body><header><h2>Live wrist camera</h2><span id="status" role="status">Connecting to host…</span></header><img id="frame" alt="Current robot wrist camera frame" hidden><button id="toggle">Pause</button><p>Read-only monitoring. Viewing the camera does not start tracking or move the arm.</p><p id="detail">Waiting for the MCP App host.</p><script>
(()=>{'use strict';let sequence=0,paused=false,ready=false,busy=false,timer=null;const pending=new Map(),status=document.getElementById('status'),frame=document.getElementById('frame'),detail=document.getElementById('detail');
function notify(method,params={}){window.parent.postMessage({jsonrpc:'2.0',method,params},'*');}
function request(method,params){return new Promise((resolve,reject)=>{const id=++sequence;const timeout=setTimeout(()=>{pending.delete(id);reject(new Error('Host request timed out'));},8000);pending.set(id,{resolve,reject,timeout});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=='2.0')return;const wait=pending.get(message.id);if(wait){clearTimeout(wait.timeout);pending.delete(message.id);message.error?wait.reject(new Error(message.error.message||'Host request failed')):wait.resolve(message.result);}if(message.method==='ui/notifications/tool-cancelled')stop();if(message.method==='ui/resource-teardown'){stop();if(message.id!==undefined)window.parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');}});
function stop(){paused=true;clearTimeout(timer);frame.hidden=true;status.textContent='Paused';}
async function refresh(){if(paused||!ready||busy||document.hidden){timer=setTimeout(refresh,500);return;}busy=true;try{const result=await request('tools/call',{name:'wrist_camera_frame',arguments:{}});if(paused)return;if(result.isError)throw new Error('Camera unavailable');const image=result.content?.find(part=>part.type==='image');if(!image)throw new Error('No camera image returned');frame.src='data:'+image.mimeType+';base64,'+image.data;frame.hidden=false;status.textContent='Live';detail.textContent='Frame received '+new Date().toLocaleTimeString()+' · monitoring updates do not become robot actions.';}catch(error){frame.hidden=true;status.textContent='Unavailable';detail.textContent=error.message+' — check the camera/server or resume to retry.';}finally{busy=false;if(!paused)timer=setTimeout(refresh,500);}}
document.getElementById('toggle').onclick=()=>{paused=!paused;document.getElementById('toggle').textContent=paused?'Resume':'Pause';clearTimeout(timer);if(paused){frame.hidden=true;status.textContent='Paused';}else refresh();};
if(window.parent===window){status.textContent='MCP App host required';detail.textContent='Open the live camera on the local demo page, or call show_wrist_camera in an MCP Apps-compatible client.';paused=true;return;}
request('ui/initialize',{appInfo:{name:'SO-101 wrist camera',version:'1.0.0'},appCapabilities:{availableDisplayModes:['inline']},protocolVersion:'2026-01-26'}).then(()=>{ready=true;notify('ui/notifications/initialized');notify('ui/notifications/size-changed',{height:600});refresh();}).catch(error=>{status.textContent='Host connection unavailable';detail.textContent=error.message+' — use the local browser viewer if this client does not support MCP Apps.';});
})();
</script></body></html>
